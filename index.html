<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulasi Perbankan Suku Bunga</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 8px;
    }

    header p {
      margin: 0;
      color: #d1d5db;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      margin-bottom: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .result {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-top: 20px;
    }

    .result-box {
      background: #f3f4f6;
      padding: 18px;
      border-radius: 10px;
    }

    .result-box small {
      color: #6b7280;
    }

    .result-box h2 {
      margin: 8px 0 0;
    }

    canvas {
      width: 100%;
      max-height: 350px;
    }

    @media (max-width: 600px) {
      .result {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Simulasi Perbankan</h1>
  <p>Belajar bagaimana suku bunga memengaruhi tabungan</p>
</header>

<div class="container">

  <div class="card">

    <h2>Masukkan Data</h2>

    <label>Modal Awal (Rp)</label>
    <input type="number" id="modal" value="1000000">

    <label>Suku Bunga per Tahun (%)</label>
    <input type="number" id="bunga" value="3.75" step="0.01">

    <label>Lama Menabung (Tahun)</label>
    <input type="number" id="tahun" value="1" min="1">

    <label>Setoran Bulanan (Rp)</label>
    <input type="number" id="setoran" value="0">

    <button onclick="hitung()">Hitung Simulasi</button>

  </div>


  <div class="card">

    <h2>Hasil Simulasi</h2>

    <div class="result">

      <div class="result-box">
        <small>Modal Awal</small>
        <h2 id="hasilModal">Rp0</h2>
      </div>

      <div class="result-box">
        <small>Total Setoran</small>
        <h2 id="hasilSetoran">Rp0</h2>
      </div>

      <div class="result-box">
        <small>Total Bunga</small>
        <h2 id="hasilBunga">Rp0</h2>
      </div>

      <div class="result-box">
        <small>Saldo Akhir</small>
        <h2 id="hasilAkhir">Rp0</h2>
      </div>

    </div>

  </div>


  <div class="card">

    <h2>Perkembangan Saldo</h2>

    <canvas id="grafik"></canvas>

  </div>

</div>


<script>

function rupiah(angka) {
  return new Intl.NumberFormat('id-ID', {
    style: 'currency',
    currency: 'IDR',
    maximumFractionDigits: 0
  }).format(angka);
}


function hitung() {

  const modal = Number(document.getElementById("modal").value);
  const bungaTahunan = Number(document.getElementById("bunga").value);
  const tahun = Number(document.getElementById("tahun").value);
  const setoranBulanan = Number(document.getElementById("setoran").value);

  const bulan = tahun * 12;

  // Bunga bulanan
  const bungaBulanan = bungaTahunan / 100 / 12;

  let saldo = modal;
  let totalSetoran = 0;

  let dataSaldo = [saldo];
  let labelBulan = ["0"];

  for (let i = 1; i <= bulan; i++) {

    // bunga setiap bulan
    saldo = saldo + (saldo * bungaBulanan);

    // setoran bulanan
    saldo = saldo + setoranBulanan;

    totalSetoran += setoranBulanan;

    dataSaldo.push(saldo);
    labelBulan.push(i);

  }

  const totalModal = modal + totalSetoran;
  const totalBunga = saldo - totalModal;

  document.getElementById("hasilModal").innerText = rupiah(modal);
  document.getElementById("hasilSetoran").innerText = rupiah(totalSetoran);
  document.getElementById("hasilBunga").innerText = rupiah(totalBunga);
  document.getElementById("hasilAkhir").innerText = rupiah(saldo);

  gambarGrafik(labelBulan, dataSaldo);

}


function gambarGrafik(labels, data) {

  const canvas = document.getElementById("grafik");
  const ctx = canvas.getContext("2d");

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const width = canvas.width;
  const height = canvas.height;

  const padding = 50;

  const maxValue = Math.max(...data);

  // Garis grafik
  ctx.beginPath();

  data.forEach((value, index) => {

    const x = padding +
      (index / (data.length - 1)) *
      (width - padding * 2);

    const y = height - padding -
      (value / maxValue) *
      (height - padding * 2);

    if (index === 0) {
      ctx.moveTo(x, y);
    } else {
      ctx.lineTo(x, y);
    }

  });

  ctx.strokeStyle = "#2563eb";
  ctx.lineWidth = 3;
  ctx.stroke();


  // Titik grafik
  data.forEach((value, index) => {

    const x = padding +
      (index / (data.length - 1)) *
      (width - padding * 2);

    const y = height - padding -
      (value / maxValue) *
      (height - padding * 2);

    ctx.beginPath();
    ctx.arc(x, y, 4, 0, Math.PI * 2);

    ctx.fillStyle = "#2563eb";
    ctx.fill();

  });


  // Sumbu X
  ctx.beginPath();
  ctx.moveTo(padding, height - padding);
  ctx.lineTo(width - padding, height - padding);
  ctx.strokeStyle = "#555";
  ctx.stroke();


  // Sumbu Y
  ctx.beginPath();
  ctx.moveTo(padding, padding);
  ctx.lineTo(padding, height - padding);
  ctx.strokeStyle = "#555";
  ctx.stroke();

}


hitung();

</script>

</body>
</html>
